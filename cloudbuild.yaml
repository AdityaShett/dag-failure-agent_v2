steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/dag-failure-agent", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/dag-failure-agent"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - dag-failure-agent
      - --image=gcr.io/$PROJECT_ID/dag-failure-agent
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=us-central1,GEMINI_MODEL_NAME=gemini-2.5-flash,REPOS_CONFIG_BUCKET=$PROJECT_ID-repos-config,REPOS_CONFIG_BLOB=repos.json,WEIGHTS_SEED_PATH=config/weights.json,AGENT_FAILURE_TOPIC=dagfailures

images:
  - gcr.io/$PROJECT_ID/dag-failure-agent